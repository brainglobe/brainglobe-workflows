name: Allen 3.1 clean atlas audit
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/lint@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
  manifest:
    name: Check manifest
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/check_manifest@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
  test:
    needs:
    - linting
    - manifest
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      KERAS_BACKEND: torch
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
        os:
        - ubuntu-latest
        include:
        - os: macos-latest
          python-version: '3.14'
        - os: windows-latest
          python-version: '3.14'
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Free Disk Space
      if: matrix.os == 'ubuntu-latest'
      uses: endersonmenezes/free-disk-space@cc5a57aa862b7769888199b7e4e012b0c8440b92
      with:
        remove_android: true
        remove_dotnet: true
        rm_cmd: rmz
        rmz_version: 3.1.1
    - name: Install HDF5 libraries (needed on M1 Macs only)
      if: matrix.os == 'macos-latest'
      run: 'brew install hdf5

        '
    - name: Run tests
      uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
      with:
        python-version: ${{ matrix.python-version }}
        secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
  benchmarks:
    name: Check benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        python-version:
        - '3.12'
    steps:
    - name: Checkout brainglobe-workflows repository
      uses: actions/checkout@v4
    - name: Create and activate conda environment
      uses: conda-incubator/setup-miniconda@v2.1.1
      with:
        miniconda-version: py310_24.1.2-0
        python-version: ${{ matrix.python-version }}
        activate-environment: asv-only
    - name: Install asv (Air Speed Velocity) for benchmarking
      run: 'pip install --upgrade pip

        pip install asv

        '
    - name: Run asv check with BG dependencies from bg-requirements.txt
      working-directory: ${{ github.workspace }}/benchmarks
      run: 'asv check -v --config $GITHUB_WORKSPACE/benchmarks/asv.bg-requirements.conf.json

        '
'on':
  workflow_dispatch: null
